<!doctype html>
<html lang="ko" style="height: 100%;">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Connect AI — Notion 스타일 채팅</title>

    <!-- Inter 폰트(노션 느낌) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
      :root{
        --bg: #f7f7f8;
        --card: #ffffff;
        --muted: #6b7280;
        --accent: #111827;
        --glass: rgba(15,23,42,0.04);
        --radius: 12px;
        --max-width: 880px;
      }

      html,body{height:100%;margin:0;background:var(--bg);font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; color:var(--accent);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
      .wrapper{
        min-height:100%;
        display:flex;
        align-items:flex-start;
        justify-content:center;
        padding:48px 20px;
        box-sizing:border-box;
      }

      .notion-card{
        width:100%;
        max-width:var(--max-width);
        background:var(--card);
        border-radius:var(--radius);
        box-shadow: 0 6px 18px rgba(12,14,21,0.08);
        border: 1px solid rgba(15,23,42,0.06);
        overflow:clip;
      }

      /* 상단 헤더 (Notion 감성) */
      .card-header{
        display:flex;
        align-items:center;
        gap:12px;
        padding:18px 20px;
        border-bottom: 1px solid rgba(15,23,42,0.04);
        background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.4));
        backdrop-filter: blur(4px);
      }
      .page-icon{
        width:38px;height:38px;border-radius:8px;
        background:var(--glass); display:flex;align-items:center;justify-content:center;
        font-weight:700;color:var(--accent);
        box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset;
      }
      .title-wrap{display:flex;flex-direction:column;line-height:1;}
      .title{font-weight:600;font-size:16px;margin:0;color:var(--accent);}
      .subtitle{font-size:13px;color:var(--muted);margin-top:2px;}

      /* 채팅 프레임 영역 */
      .chat-area{
        height:72vh; /* 화면 비율로 지정 */
        min-height:520px;
        max-height:80vh;
        background: linear-gradient(180deg, rgba(250,250,250,1), rgba(247,247,248,1));
      }

      .frame-wrap{
        height:100%;
        padding:18px;
        box-sizing:border-box;
        display:flex;
        flex-direction:column;
        gap:12px;
      }

      .frame-card{
        flex:1 1 auto;
        background: #fff;
        border-radius:10px;
        overflow:hidden;
        border: 1px solid rgba(15,23,42,0.03);
        box-shadow: 0 8px 20px rgba(12,14,21,0.04);
        display:flex;
        position:relative;
      }

      iframe.chat-frame{
        width:100%;
        height:100%;
        border:0;
        display:block;
      }

      /* 하단 툴바 */
      .tools{
        display:flex;
        align-items:center;
        gap:8px;
      }
      .tools .muted{color:var(--muted);font-size:13px;}
      .btn{
        margin-left:auto;
        background:transparent;
        border: 1px solid rgba(15,23,42,0.06);
        padding:8px 12px;
        border-radius:8px;
        font-size:13px;
        cursor:pointer;
        color:var(--accent);
      }
      .btn.ghost{
        background:transparent;
      }
      .btn.primary{
        background:#111827;color:#fff;border:none;
      }

      /* 모바일/반응형 */
      @media (max-width:640px){
        .wrapper{ padding:22px 12px; }
        .card-header{ padding:12px; }
        .frame-wrap{ padding:12px; }
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <main class="notion-card" role="main" aria-label="Connect AI Notion-style chat container">
        <header class="card-header">
          <div class="page-icon" aria-hidden="true">AI</div>
          <div class="title-wrap">
            <div class="title">Connect AI</div>
            <div class="subtitle">노션 감성의 채팅 인터페이스</div>
          </div>
        </header>

        <section class="chat-area" aria-labelledby="chat-title">
          <div class="frame-wrap">
            <div class="frame-card" role="region" aria-label="채팅 창">
              <iframe
                class="chat-frame"
                title="Connect AI Webchat"
                aria-label="Connect AI webchat iframe"
                src="https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_multimodelaiagent_8PEzqX/webchat?__version__=2&amp;enableFileAttachment=false&amp;cliAgent=true"
                loading="lazy"
                allow="microphone; camera; clipboard-write"
                sandbox="allow-scripts allow-same-origin"
              ></iframe>
            </div>

            <div class="tools" aria-hidden="false">
              <div class="muted">팁: 프레임이 제대로 로드되지 않으면 팝아웃 버튼으로 새 창에서 열어보세요.</div>
              <button class="btn ghost" id="popoutBtn" title="Pop out (새 창으로 열기)">팝아웃</button>
              <a class="btn" id="openSrc" href="https://copilotstudio.microsoft.com/" target="_blank" rel="noopener noreferrer">Copilot Studio</a>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script>
      (function(){
        const popoutBtn = document.getElementById('popoutBtn');
        const iframe = document.querySelector('iframe.chat-frame');
        popoutBtn.addEventListener('click', () => {
          try {
            const src = iframe.getAttribute('src');
            window.open(src, '_blank', 'noopener,noreferrer');
          } catch (e) {
            console.error(e);
            alert('새 창을 여는 중 오류가 발생했습니다.');
          }
        });
      })();
    </script>
  </body>
</html>
